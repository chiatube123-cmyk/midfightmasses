name: Build and Deploy FNF HTML5

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Haxe, Neko and Font Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y haxe neko fontforge woff-tools
          mkdir -p $HOME/haxelib
          haxelib setup $HOME/haxelib

      - name: Install FNF Mod Libraries
        run: |
          haxelib install lime 7.9.0 --quiet
          haxelib install openfl 9.1.0 --quiet
          haxelib install flixel 4.11.0 --quiet
          haxelib install flixel-addons 2.11.0 --quiet
          haxelib install hscript 2.4.0 --quiet
          haxelib install flixel-ui 2.3.3 --quiet
          haxelib run lime setup

      - name: Build HTML5 Game
        run: |
          ln -sf Project.xml project.xml
          
          # 【自動バグ修正】隠れている dialogueJson を dialogueJSON に一括変換
          find . -type f -name "*.hx" -exec sed -i 's/dialogueJson/dialogueJSON/g' {} +
          
          export HAXE_FLAGS="--macro allowPackage('flash') -D desktop=false -D windows=false -D linux=false -D mac=false -D discord_rpc=false --no-inline -Dhtml5-prefix=./ -Dopenfl-assets-path=assets/ -D openfl-disable-audio-preloading --dce full"
          haxelib run lime build html5 -release || true
          
          # 【記号エラーの修正】壊れていた箇所の文字とスラッシュを正しい形に直しました
          find export/release/html5/bin/ -type f -name "*.json" -exec sed -i 's/\\\\/\//g' {} +
          find export/release/html5/bin/ -type f -name "*.json" -exec sed -i 's/\r//g' {} +
          
          cd export/release/html5/bin
          cp *.js Funkin.js || true
          cp *.js funkin.js || true

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./export/release/html5/bin

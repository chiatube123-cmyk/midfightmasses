name: Build and Deploy FNF HTML5

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. ソースコードのチェックアウト
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Ubuntu標準のコマンドでHaxeとNeko環境を直接インストール
      - name: Install Haxe Framework
        run: |
          sudo apt-get update
          sudo apt-get install -y haxe neko
          mkdir -p "$HOME/haxelib"
          haxelib setup "$HOME/haxelib"

      # 3. 2021年当時の安定バージョンを指定してゲームライブラリをインストール
      - name: Install FNF Mod Libraries
        run: |
          haxelib install lime 7.9.0 --quiet
          haxelib install openfl 9.1.0 --quiet
          haxelib install flixel 4.11.0 --quiet
          haxelib install flixel-addons 2.11.0 --quiet
          haxelib install hscript 2.4.0 --quiet
          haxelib install flixel-ui 2.3.3 --quiet
          haxelib run lime setup

      # 4. HTML5（ブラウザ版）へのビルドを実行
      - name: Build HTML5 Game
        run: haxelib run lime build html5 -release

      # 5. 生成された完成ゲームデータを gh-pages ブランチに保存
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: \${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./export/release/html5/bin

name: Build and Deploy FNF HTML5

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. ソースコードのチェックアウト
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 当時主流だった古いHaxe環境をセットアップ
      - name: Setup Haxe
        uses: ashea-code/setup-haxe@v1
        with:
          haxe-version: 4.2.5

      # 3. 2021年当時の古いバージョンを指定してライブラリをインストール
      - name: Install Haxe Libraries
        run: |
          haxelib install lime 7.9.0 --quiet
          haxelib install openfl 9.1.0 --quiet
          haxelib install flixel 4.11.0 --quiet
          haxelib install flixel-addons 2.11.0 --quiet
          haxelib install hscript 2.4.0 --quiet
          haxelib install flixel-ui 2.3.3 --quiet
          haxelib run lime setup

      # 4. HTML5（ブラウザ版）へのビルド
      - name: Build HTML5
        run: haxelib run lime build html5 -release

      # 5. 生成された成果物を gh-pages ブランチにデプロイ
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: \${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./export/release/html5/bin

name: Build and Deploy FNF HTML5

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. ソースコードのチェックアウト
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 前回確実に成功したLinux標準コマンドで環境を構築
      - name: Setup Haxe and Neko
        run: |
          sudo apt-get update
          sudo apt-get install -y haxe neko
          mkdir -p "$HOME/haxelib"
          haxelib setup "$HOME/haxelib"

      # 3. 前回確実に成功したライブラリのインストール
      - name: Install FNF Mod Libraries
        run: |
          haxelib install lime 7.9.0 --quiet
          haxelib install openfl 9.1.0 --quiet
          haxelib install flixel 4.11.0 --quiet
          haxelib install flixel-addons 2.11.0 --quiet
          haxelib install hscript 2.4.0 --quiet
          haxelib install flixel-ui 2.3.3 --quiet
          haxelib run lime setup

      # 4. 【今回新しく追加】エラーを引き起こす最新の厳格なチェックを無効化してビルド
      - name: Build HTML5 Game
        run: |
          # 5年前の古いコードでもコンパイルを通すための魔法のオプションを追加
          haxelib run lime build html5 -release --macro "allowPackage('flash')"

      # 5. 生成された成果物を gh-pages ブランチに保存
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./export/release/html5/bin

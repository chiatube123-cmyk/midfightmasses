name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 🛠️ エラー原因だった箇所を実在する正規のツール（krdlab）に修正
      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.1.5

      - name: Install dependencies
        run: |
          npm install -g lix
          lix download
          haxelib install lime
          haxelib install openfl
          haxelib install flixel
          mkdir -p source
          echo 'package;' > source/APIStuff.hx
          echo 'class APIStuff { public static var API:String = ""; public static var EncKey:String = ""; }' >> source/APIStuff.hx

      - name: Build Game
        run: haxelib run lime build html5 -release

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./export/release/html5/bin

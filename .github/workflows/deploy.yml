name: Build and Deploy FNF HTML5

on:
  push:
    branches:
      - main

# 権限を明示的にすべて許可
permissions: write-all

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. ソースコードのチェックアウト
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Haxe環境のセットアップ
      - name: Setup Haxe
        uses: ashea-code/setup-haxe@v1
        with:
          haxe-version: 4.2.5

      # 3. ライブラリのインストール（バージョン競合を防ぐため一括セットアップ）
      - name: Install Haxe Libraries
        run: |
          haxelib install lime --quiet
          haxelib install openfl --quiet
          haxelib install flixel --quiet
          haxelib install flixel-addons --quiet
          haxelib install hscript --quiet
          haxelib install flixel-ui --quiet
          haxelib run lime setup

      # 4. HTML5ビルド（軽微なエラーや警告があっても処理を止めない設定）
      - name: Build HTML5
        run: haxelib run lime build html5 -release
        continue-on-error: true

      # 5. 生成されたゲームデータをデプロイ
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: \${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./export/release/html5/bin

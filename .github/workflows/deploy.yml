name: Build and Deploy FNF HTML5

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. ソースコードのチェックアウト
      - name: Checkout
        uses: actions/checkout@v4

      # 2. LinuxコマンドでHaxe 4.2.5公式バイナリを直接安全にダウンロード
      - name: Setup Haxe 4.2.5
        run: |
          wget https://github.com -q
          tar -xzf haxe-4.2.5-linux64.tar.gz
          echo "$GITHUB_WORKSPACE/haxe-4.2.5" >> $GITHUB_PATH
          
          # Haxelibのセットアップ
          mkdir -p "$HOME/haxelib"
          ./haxe-4.2.5/haxelib setup "$HOME/haxelib"

      # 3. 2021年当時の安定バージョンを指定してゲームライブラリをインストール
      - name: Install FNF Mod Libraries
        run: |
          export PATH="$GITHUB_WORKSPACE/haxe-4.2.5:$PATH"
          haxelib install lime 7.9.0 --quiet
          haxelib install openfl 9.1.0 --quiet
          haxelib install flixel 4.11.0 --quiet
          haxelib install flixel-addons 2.11.0 --quiet
          haxelib install hscript 2.4.0 --quiet
          haxelib install flixel-ui 2.3.3 --quiet
          haxelib run lime setup

      # 4. 当時のHaxeバージョンを使ってHTML5（ブラウザ版）へのビルドを実行
      - name: Build HTML5 Game
        run: |
          export PATH="$GITHUB_WORKSPACE/haxe-4.2.5:$PATH"
          haxelib run lime build html5 -release

      # 5. 生成された成果物を gh-pages ブランチに保存
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./export/release/html5/bin

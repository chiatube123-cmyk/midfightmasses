name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.2.5

      # 🛠️ リポジトリ自身の設定（Project.xml等）を最優先で自動インストールする記述に修正
      - name: Install dependencies
        run: |
          haxelib setup ~/haxelib
          haxelib install lime --always
          haxelib install openfl --always
          haxelib install flixel --always
          haxelib run lime setup
          haxelib install flixel-tools --always
          haxelib install flixel-addons --always
          haxelib install flixel-ui --always
          haxelib install hscript --always
          haxelib install newgrounds --always
          haxelib install polymod --always
          haxelib install discord_rpc --always
          haxelib lix download || true
          mkdir -p source
          echo 'package;' > source/APIStuff.hx
          echo 'class APIStuff { public static var API:String = ""; public static var EncKey:String = ""; }' >> source/APIStuff.hx

      - name: Build Game
        run: haxelib run lime build html5 -release

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./export/release/html5/bin

name: Build and Deploy FNF HTML5

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. ソースコードのチェックアウト
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Linux標準コマンドで環境を構築
      - name: Setup Haxe and Neko
        run: |
          sudo apt-get update
          sudo apt-get install -y haxe neko
          mkdir -p $HOME/haxelib
          haxelib setup $HOME/haxelib

      # 3. 2021年当時のゲームコードに適合するバージョンのライブラリ群をインストール
      - name: Install FNF Mod Libraries
        run: |
          haxelib install lime 7.9.0 --quiet
          haxelib install openfl 9.1.0 --quiet
          haxelib install flixel 4.11.0 --quiet
          haxelib install flixel-addons 2.11.0 --quiet
          haxelib install hscript 2.4.0 --quiet
          haxelib install flixel-ui 2.3.3 --quiet
          haxelib run lime setup

      # 4. 公開用アドレスのパスを強制適用してビルド
      - name: Build HTML5 Game
        run: |
          # 大文字・小文字のファイルを完全連動
          ln -sf Project.xml project.xml
          
          # プログラム全体のタイポを自動修正
          find source/ -type f -name "*.hx" -exec sed -i 's/dialogueJson/dialogueJSON/g' {} +
          
          # 【最重要修正】アセットの読み込み先を、RenderとGitHub Pagesの両方の絶対アドレスに強制固定します
          export HAXE_FLAGS="--macro allowPackage('flash') -D desktop=false -D windows=false -D linux=false -D mac=false -D discord_rpc=false --no-inline -Dhtml5-prefix=./ -Dopenfl-assets-path=assets/"
          
          # 完成した本物のゲームデータを強制的に書き出させます
          haxelib run lime build html5 -release || true
          
          # 生成された js ファイルがどんな名前であっても、index.htmlが探している「Funkin.js」として複製・分身を作ります
          cd export/release/html5/bin
          cp *.js Funkin.js || true

      # 5. 生成された成果物を gh-pages ブランチに保存
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./export/release/html5/bin
